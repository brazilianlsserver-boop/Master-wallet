<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OK PAY</title>
    <meta name="description" content="OK PAY online earning, order management, and wallet payment platform matching the mobile app interface." />
    <meta property="og:title" content="OK PAY" />
    <meta property="og:description" content="OK PAY online earning, order management, and wallet payment platform matching the mobile app interface." />
    <meta property="og:type" content="website" />
    <!-- PWA / Android APK Installation Configuration -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0FA968" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OK PAY" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA / WebAPK support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
